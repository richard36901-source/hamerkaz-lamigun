<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>המרכז הארצי למיגון – לקוח חדש</title>
<link rel="icon" type="image/jpeg" href="">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(160deg, #e8f0fa 0%, #f4f8ff 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .card {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 8px 40px rgba(30,60,120,0.13);
    padding: 40px 36px 36px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .logo-wrap {
    margin-bottom: 18px;
  }

  .logo-wrap img {
    width: 160px;
    height: 160px;
    object-fit: contain;
    border-radius: 12px;
  }

  .company-name {
    font-size: 1.18rem;
    font-weight: 700;
    color: #1a3a6b;
    margin-bottom: 4px;
    letter-spacing: 0.01em;
  }

  .form-title {
    font-size: 1.55rem;
    font-weight: 800;
    color: #c0392b;
    margin-bottom: 28px;
    border-bottom: 3px solid #e8eef7;
    padding-bottom: 14px;
  }

  label {
    display: block;
    text-align: right;
    font-size: 0.93rem;
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 5px;
  }

  input {
    width: 100%;
    border: 1.8px solid #ccd8ea;
    border-radius: 9px;
    padding: 13px 14px;
    font-size: 1rem;
    font-family: inherit;
    color: #1a1a2e;
    background: #f7faff;
    transition: border 0.2s, box-shadow 0.2s;
    direction: rtl;
    margin-bottom: 18px;
  }

  input:focus {
    outline: none;
    border-color: #1a3a6b;
    box-shadow: 0 0 0 3px rgba(26,58,107,0.10);
    background: #fff;
  }

  input.error {
    border-color: #c0392b;
    box-shadow: 0 0 0 3px rgba(192,57,43,0.10);
  }

  .err-msg {
    color: #c0392b;
    font-size: 0.82rem;
    text-align: right;
    margin-top: -13px;
    margin-bottom: 12px;
    min-height: 16px;
  }

  button {
    width: 100%;
    background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 1.12rem;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: transform 0.15s, box-shadow 0.15s;
    margin-top: 4px;
    box-shadow: 0 4px 16px rgba(192,57,43,0.22);
  }

  button:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(192,57,43,0.28); }
  button:active { transform: translateY(0); }

  .success-box {
    display: none;
    background: #eafaf1;
    border: 2px solid #27ae60;
    border-radius: 12px;
    padding: 22px;
    color: #1e8449;
    font-size: 1.1rem;
    font-weight: 700;
    margin-top: 18px;
  }

  footer {
    margin-top: 18px;
    font-size: 0.78rem;
    color: #8a9bb5;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo-wrap">
    <img id="logoImg" src="" alt="לוגו המרכז הארצי למיגון">
  </div>
  <div class="company-name">המרכז הארצי למיגון</div>
  <div class="form-title">לקוח חדש</div>

  <form id="leadForm" novalidate>
    <label for="name">שם מלא</label>
    <input type="text" id="name" placeholder="הכנס שם מלא" autocomplete="name">
    <div class="err-msg" id="nameErr"></div>

    <label for="phone">מספר טלפון</label>
    <input type="tel" id="phone" placeholder="972XXXXXXXXX" autocomplete="tel" dir="ltr">
    <div class="err-msg" id="phoneErr"></div>

    <button type="submit">שלח פרטים</button>
  </form>

  <div class="success-box" id="successBox">
    ✅ פרטיך נשלחו בהצלחה! נציג ייצור איתך קשר בקרוב.

      הגש לקוח נוסף
    </button>
  </div>
</div>

  const logoSrc = 'data:image/jpeg;base64,' + logoB64;
  document.getElementById('logoImg').src = logoSrc;

  // Favicon
  const link = document.querySelector('link[rel="icon"]');
  link.href = logoSrc;

  const form = document.getElementById('leadForm');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    let valid = true;

    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const nameErr = document.getElementById('nameErr');
    const phoneErr = document.getElementById('phoneErr');
    const nameInput = document.getElementById('name');
    const phoneInput = document.getElementById('phone');

    nameErr.textContent = '';
    phoneErr.textContent = '';
    nameInput.classList.remove('error');
    phoneInput.classList.remove('error');

    if (!name) {
      nameErr.textContent = 'נא להזין שם מלא';
      nameInput.classList.add('error');
      valid = false;
    }

    const phoneClean = phone.replace(/[\s\-\(\)]/g, '');
    const phoneRx = /^9725\d{8}$|^972[2-9]\d{8}$/;
    if (!phoneClean) {
      phoneErr.textContent = 'נא להזין מספר טלפון';
      phoneInput.classList.add('error');
      valid = false;
    } else if (!phoneRx.test(phoneClean)) {
      phoneErr.textContent = 'פורמט לא תקין. דוגמה: 972501234567';
      phoneInput.classList.add('error');
      valid = false;
    }

    if (valid) {
      const btn = form.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'שולח...';

      fetch('https://hook.eu1.make.com/voime6yvsh4mfd295tkmbvsu4z34v6wk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, phone: phoneClean })
      })
      .catch(() => {}) // show success regardless
      .finally(() => {
        form.style.display = 'none';
        document.getElementById('successBox').style.display = 'block';
      });
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    document.getElementById('name').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('nameErr').textContent = '';
    document.getElementById('phoneErr').textContent = '';
    document.getElementById('name').classList.remove('error');
    document.getElementById('phone').classList.remove('error');
    form.querySelector('button[type=submit]').disabled = false;
    form.querySelector('button[type=submit]').textContent = 'שלח פרטים';
    document.getElementById('successBox').style.display = 'none';
    form.style.display = 'block';
  });
</script>
